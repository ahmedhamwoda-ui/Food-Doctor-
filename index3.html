<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial scale=1.0"/>
    <title>نظامك الغذائي</title>
    <style>
      *{margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Tahoma";
       }
      body{background:#f5f7fa;
           min-height:100vh;
           display:flex;
           justify-content:center;
           align-items:center;
           padding:20px;
          }
      .container{background:white; 
                 width:100%;
                 max-width:500px;
                 padding:25px;
                 border-radius:15px;
                 box-shadow:0 4px 20px
                 rgba(0,0,0,0.08);
                 text-align:center;
                }
      h2{color:#1976d2;
         font-size:24px;
         margin-bottom:25px;
        }
      .info-box{background:#e3f2fd;
                padding:20px;
                border-radius:12px;
                text-align:right;
                margin-bottom:20px;
               }
      .info-box p{font-size:17px;
                  margin:12px 0;
                  color:#333;
                 }
      .info-box b{color:#1976d2;}
      .plan-box{background:#fff3e0;
                padding:20px;
                border-radius:12px;
                text-align:right;
                margin-bottom:20px;
                border-right:4px solid #ff9800;
               }
      .plan-box h3{color:#e65100;
                   margin-bottom:10px;
                  }
      #plan{white-space:pre-line;}
      .btn{background:#2196f3;
           color:white;
           border:none;
           padding:14px;
           width:100%;
           border-radius:10px;
           font-size:18px;
           cursor:pointer;
           margin-top:10px;
          }
      .btn:hover{background:#1976d2;}
    </style>
  </head>
  <body>
    <div class="container">
      <h2 id="welcome">مرحبا بك</h2>
      <div class="info-box">
        <p><b>الاسم:</b><span id="name"></span></p>
        <p><b>الجنس:</b><span id="gender"></span></p>
        <p><b>العمر:</b><span id="age"></span></p>
        <p><b>الهدف:</b><span id="goal"></span></p>
      </div>
      <div class="plan-box">
        <h3>الجدول الغذائي الخاص بك</h3>
        <p id="plan">تحضير جدول غذائي</p>
      </div>
      <button type="button" class="btn"
        onclick="localStorage.clear();
        window.location.href='index.html'">
      </button>
    </div>
    <script>
      const name=localStorage.getItem("name")||"زائر";
      const gender=localStorage.getItem("gender")||"غير محدد";
      const age=localStorage.getItem("age")||"غير محدد";
      const goal=localStorage.getItem("goal")||"";
      document.getElementById("welcome").innerText= "مرحبا"+name;
      document.getElementById("name").innerText=name;
      document.getElementById("gender").innerText=gender;
      document.getElementById("age").innerText=age;
      document.getElementById("goal").innerText=goal;
      let plan="";
      if(goal==="تنزيل الوزن"){
        plan="1.شرب ٢لتر ماء يوميا/n"+
             "2.تقليل السكر والخبز/n"+
             "3.الجري 30 دقيقة 4 مرات في الاسبوع";}
      else if(goal==="زيادة الوزن"){
        plan="1.زيادة معدل البروتين/n"+
             "2.اكثر من النشويات/n"+
             "3.شرب الماء 3 لي 4 لتر في اليوم";}
      else if(goal==="تثبيت الوزن"){
        plan="1. 8 ساعات نوم/n"+
             "2.تمارين متنوعة/n"+
             "3. 3 وجبات في اليوم";}
      else{
        plan="لم يتم تحديد الهدف بعد";}
      document.getElementById("plan").innerText=plan;
    </script>
  </body>
</html>
