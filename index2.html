<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البيانات الصحية</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin: 0;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 450px;
      }

      h2 {
        color: #667eea;
        text-align: center;
        margin-bottom: 25px;
        font-size: 28px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
      }

      input:focus,
      select:focus {
        border-color: #667eea;
        outline: none;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s ease;
      }

      .btn:hover {
        background: #764ba2;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>الخطوة الثانية - البيانات الصحية</h2>

      <form id="healthForm">
        <div class="form-group">
          <label for="weight">الوزن الحالي</label>
          <input type="number" id="weight" min="0" step="0.1" placeholder="ادخل وزنك الحالي" required />
        </div>

        <div class="form-group">
          <label for="disease">هل لديك أي أمراض مزمنة</label>
          <input type="text" id="disease" placeholder="اكتب اسم المرض أو اكتب لا يوجد" required />
        </div>

        <button type="submit" class="btn">تحديد النظام الغذائي</button>
      </form>
    </div>

    <script>
      document.getElementById('healthForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const savedData = JSON.parse(localStorage.getItem('userData') || '{}');

        savedData.weight = document.getElementById('weight').value;
        savedData.disease = document.getElementById('disease').value;

        localStorage.setItem('userData', JSON.stringify(savedData));

        alert('تم حفظ البيانات بنجاح\nالوزن: ' + savedData.weight + '\nالمرض: ' + savedData.disease);

        window.location.href = 'index3.html';
      });
    </script>
  </body>
</html>
