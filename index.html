<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>برنامج الغذاء الذكي</title>
    <style>
      * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
      body { background: #f0f4f8; margin: 0; padding: 20px; }
      .topbar {
        display: flex; justify-content: space-between; align-items: center;
        background: #2e6cff; color: white; padding: 12px 20px;
        border-radius: 0 0 15px 15px; margin: -20px -20px 30px;
      }
      .brand, .nav-icons { display: flex; align-items: center; gap: 10px; }
      .brand-mark { font-size: 24px; }
      .topbar h1 { font-size: 22px; margin: 0; }
      .icon-btn {
        width: 40px; height: 40px; border-radius: 50%;
        background: rgba(255,255,255,.2); display: flex; align-items: center;
        justify-content: center; text-decoration: none; font-size: 20px; color: white;
      }
      .container {
        background: white; width: 100%; max-width: 420px; min-height: 350px;
        padding: 30px; border-radius: 20px; margin: 0 auto;
        box-shadow: 0 4px 12px rgba(33,150,243,.15); border-top: 5px solid #2196f3;
      }
      h2 { color: #1976d2; text-align: center; margin: 0 0 12px; font-size: 24px; }
      .step-count { color: #607d8b; text-align: center; margin: 0 0 30px; }
      .field { margin-bottom: 20px; }
      label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
      input, select {
        width: 100%; padding: 12px; border: 2px solid #90caf9;
        border-radius: 10px; font-size: 16px; outline: none; transition: .3s;
      }
      input:focus, select:focus {
        border-color: #2196f3; box-shadow: 0 0 5px rgba(33,50,243,.3);
      }
      .actions { display: flex; gap: 10px; margin-top: 24px; }
      .btn {
        flex: 1; padding: 14px; background: #2196f3; color: white; border: none;
        border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
      }
      .btn:hover { background: #1976d2; }
      .btn-secondary { background: #78909c; }
      .btn-secondary:hover { background: #607d8b; }
      [hidden] { display: none !important; }
      @media (max-width: 480px) {
        body { padding: 14px; }
        .topbar { margin: -14px -14px 24px; }
        .container { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🥗</span>
        <h1>طبيب الغذاء</h1>
      </div>
      <nav class="nav-icons" aria-label="روابط الموقع">
        <a href="chat.html" class="icon-btn" aria-label="المحادثة">💬</a>
        <a href="profile.html" class="icon-btn" aria-label="الملف الشخصي">👤</a>
      </nav>
    </header>

    <main class="container">
      <form id="profileForm">
          <p class="step-count" id="stepCount" aria-live="polite">الخطوة 1 من 10</p>
         
        <div id="page1">
            <h2>الملف الشخصي 👤</h2>
          <section class="step">
            <div class="field">
              <label for="name">الاسم</label>
              <input type="text" id="name" autocomplete="name" required />
            </div>
          </section>

          <section class="step" hidden>
            <div class="field">
              <label for="gender">الجنس</label>
              <select id="gender" required>
                <option value="">اختر الجنس</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
              </select>
            </div>
          </section>

          <section class="step" hidden>
            <div class="field">
              <label for="age">العمر</label>
              <input type="number" id="age" min="1" max="120" required />
            </div>
          </section>

          <section class="step" hidden>
            <div class="field">
              <label for="weight">الوزن (كجم)</label>
              <input type="number" id="weight" min="1" max="500" step="0.1" required />
            </div>
          </section>

          <section class="step" hidden>
            <div class="field">
              <label for="height">الطول (سم)</label>
              <input type="number" id="height" min="50" max="250" step="0.1" required />
            </div>
          </section>

          <section class="step" hidden>
            <div class="field">
              <label for="country">البلد</label>
              <input type="text" id="country" autocomplete="country-name" required />
            </div>
          </section>

          <section class="step" hidden>
            <div class="field">
              <label for="email">البريد الإلكتروني</label>
              <input type="email" id="email" autocomplete="email" required />
            </div>
          </section>

          <section class="step" hidden>
            <div class="field">
              <label for="goal">الهدف من النظام</label>
              <select id="goal" required>
                <option value="">اختر الهدف</option>
                <option value="تنزيل الوزن">تنزيل الوزن</option>
                <option value="زيادة الوزن">زيادة الوزن</option>
                <option value="زيادة عضلات">زيادة عضلات</option>
                <option value="تثبيت الوزن">تثبيت الوزن</option>
              </select>
            </div>
          </section>
            <section class="step" hidden>
              <h2>مراجعة الملف الشخصي</h2>
              <p>راجع البيانات قبل الانتقال</p>
              <div id="reviewContent"
                class="review-list">
              </div>
            </section>
        </div>

        <div id="page2" hidden>
          <h2>البيانات الصحية</h2>
          <section class="step" hidden>
            <div class="field">
              <label for="diseases">الأمراض المزمنة</label>
              <input type="text" id="diseases"/>
            </div>

            <div class="field">
              <label for="activity">النشاط اليومي 🏃‍♂️</label>
              <select id="activity" required>
                <option value="">اختر مستوى النشاط</option>
                <option value="low">قليل الحركة 🚶‍♂️</option>
                <option value="medium">متوسط نشاط 🏃‍♂️</option>
                <option value="high">نشاط مرتفع 🚴‍♂️</option>
              </select>
            </div>

            <div class="field">
              <label for="food">المعلومات الغذائية</label>
              <select id="food" required>
                <option value="">اختر نظامك الغذائي</option>
                <option value="normal">غذاء متنوع</option>
                <option value="vegetarian">نباتي</option>
                <option value="low-carb">قليل الكربوهيدرات</option>
                <option value="other">نظام آخر</option>
              </select>
            </div>

            <div class="field">
              <label for="cuisine">نوع المطبخ المفضل 🥗</label>
              <select id="cuisine">
                <option value="">اختار المطبخ 🍽</option>
                <option value="arabic">عربي 🥘</option>
                <option value="western">غربي 🍔</option>
                <option value="french">فرنسي 🥐</option>
                <option value="Asian">آسيوي 🍲</option>
                <option value="mixed">متنوع 🍽</option>
              </select>
            </div>
          </section>
        </div>

        <div class="actions">
          <button type="button" id="backBtn" class="btn btn-secondary" hidden>السابق</button>
          <button type="button" id="nextBtn" class="btn">التالي</button>
          <button type="submit" id="saveBtn" class="btn" hidden>حفظ والمتابعة</button>
        </div>
      </form>
    </main>

    <script>
      const page1 = document.getElementById("page1");
      const page2 = document.getElementById("page2");
      const steps = Array.from(document.querySelectorAll(".step"));
      const stepCount = document.getElementById("stepCount");
      const backBtn = document.getElementById("backBtn");
      const nextBtn = document.getElementById("nextBtn");
      const saveBtn = document.getElementById("saveBtn");
      const form = document.getElementById("profileForm");

      const fieldIds = [
        "name",
        "gender",
        "age",
        "weight",
        "height",
        "country",
        "email",
        "goal",
        "diseases",
        "activity",
        "food",
        "cuisine"
      ];

      let currentStep = 0;

      fieldIds.forEach((id) => {
        const field = document.getElementById(id);
        if (field) {
          field.value = localStorage.getItem(id) || "";
        }
      });
       function updateReview (){
         reviewContent.replaceChildren();
         profileFields.forEach([id=>label]{
      const field =document.getElementById("id");
      const value =field.value.trim()||"-";
      const selectedText =field.tagName ==="SELECT"?
        field.options[field.selectedIndex]?.text(value ||)
                                                 :value;
      const item =document.createElement("div");
      const title =document.createElement("strong");
      const content =document.createElement("span");
      item.className="review-item";
      title.textContent=label;
      content.textContent=selectedText;
      item.append(title,content);
      reviewContent.append(item);});
      }
      

      function showStep(index) {
        if (index < 0 || index >= steps.length) return;

        currentStep = index;

        steps.forEach((step, stepIndex) => {
          step.hidden = stepIndex !== currentStep;
        });

        const currentStepElement = steps[currentStep];
        page1.hidden = !page1.contains(currentStepElement);
        page2.hidden = !page2.contains(currentStepElement);

        stepCount.textContent = `الخطوة ${currentStep + 1} من ${steps.length}`;
        backBtn.hidden = currentStep === 0;
        nextBtn.hidden = currentStep === steps.length - 1;
        saveBtn.hidden = currentStep !== steps.length - 1;
        if (currentStep ==8)
          updateReview();
        const firstField=currentStepElement.querySelector("input,select");
        if(firstField)
          firstField.focus();
      {

        const firstField = currentStepElement.querySelector("input, select");
        if (firstField) firstField.focus();
      }

      function saveCurrentStep() {
        const currentFields = steps[currentStep].querySelectorAll("input, select");

        for (const field of currentFields) {
          if (field.required && !field.reportValidity()) {
            field.focus();
            return false;
          }
        }

        currentFields.forEach((field) => {
          localStorage.setItem(field.id, field.value.trim());
        });

        return true;
      }

      nextBtn.addEventListener("click", () => {
        if (saveCurrentStep()) {
          showStep(currentStep + 1);
        }
      });

      backBtn.addEventListener("click", () => {
        showStep(currentStep - 1);
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!saveCurrentStep()) return;

        alert("تم حفظ البيانات بنجاح ✅");
      });

      showStep(0);
    </script>
  </body>
</html>
