<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الملف الشخصي - طبيب الغذاء</title>
    <style>
      :root {
        --primary: #2e6cff;
        --primary-dark: #1d52d6;
        --primary-soft: #edf3ff;
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1b2430;
        --muted: #7a8394;
        --success: #37b76c;
        --shadow: 0 12px 30px rgba(46, 108, 255, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #edf4ff 0%, var(--bg) 100%);
        font-family: "Tahoma", "Segoe UI", sans-serif;
        color: var(--text);
      }

      .page {
        width: min(430px, calc(100% - 24px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        border-radius: 0 0 28px 28px;
        padding: 18px 22px;
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.18);
        display: grid;
        place-items: center;
        font-size: 22px;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.3rem;
      }

      .nav-icons {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.16);
        color: white;
        font-size: 20px;
      }

      .profile-card {
        background: var(--card);
        border-radius: 28px;
        box-shadow: var(--shadow);
        margin-top: 24px;
        overflow: hidden;
      }

      .profile-header {
        background: linear-gradient(135deg, #f3f7ff 0%, #edf3ff 100%);
        padding: 28px 22px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8bb0ff 0%, #2e6cff 100%);
        color: white;
        display: grid;
        place-items: center;
        font-size: 2rem;
        font-weight: 700;
        box-shadow: 0 10px 25px rgba(46, 108, 255, 0.28);
      }

      .profile-user { flex: 1; }

      .profile-user h2 {
        margin: 0 0 6px;
        font-size: 1.5rem;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .status-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        background: #eafaf1;
        color: var(--success);
        font-size: 0.8rem;
        padding: 7px 12px;
        border-radius: 999px;
      }

      .status-tag::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 18px 20px 0;
      }

      .stat-box {
        background: #f8fafe;
        border: 1px solid #edf1f7;
        border-radius: 18px;
        padding: 16px 10px;
        text-align: center;
      }

      .stat-box strong {
        display: block;
        font-size: 1.1rem;
        color: var(--primary);
        margin-bottom: 6px;
      }

      .stat-box span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .section {
        padding: 18px 20px 0;
      }

      .section-title {
        margin: 0 0 12px;
        font-size: 1.05rem;
        color: var(--text);
      }

      .info-list {
        display: grid;
        gap: 12px;
      }

      .info-item {
        background: #f8f9fb;
        border: 1px solid #edf1f7;
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .info-item .label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .info-item .value {
        font-weight: 700;
        color: var(--text);
        text-align: left;
      }

      .actions {
        padding: 22px 20px 24px;
      }

      .btn-back {
        display: block;
        width: 100%;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        border: none;
        border-radius: 16px;
        padding: 18px 20px;
        text-decoration: none;
        text-align: center;
        font-size: 1rem;
        font-weight: 700;
        box-shadow: 0 12px 22px rgba(46, 108, 255, 0.25);
      }

      @media (max-width: 360px) {
        .profile-header { flex-direction: column; text-align: center; }
        .stats { grid-template-columns: 1fr; }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">🥗</div>
          <h1>طبيب الغذاء</h1>
        </div>

        <div class="nav-icons">
          <a href="index.html" class="icon-btn" aria-label="الرئيسية">🏠</a>
          <span class="icon-btn" aria-label="الملف الشخصي">👤</span>
        </div>
      </header>

      <main class="profile-card">
        <div class="profile-header">
          <div class="avatar">👤</div>

          <div class="profile-user">
            <h2 id="name-display">غير محدد</h2>
            <p class="subtitle">مستخدم جديد</p>
            <div class="status-tag">نشط الآن</div>
          </div>
        </div>

        <div class="stats">
          <div class="stat-box">
            <strong id="age-box">0</strong>
            <span>العمر</span>
          </div>
          <div class="stat-box">
            <strong id="weight-box">0</strong>
            <span>الوزن</span>
          </div>
          <div class="stat-box">
            <strong id="gender-box">-</strong>
            <span>الجنس</span>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title">معلومات شخصية</h3>
          <div class="info-list">
            <div class="info-item">
              <span class="label">الاسم</span>
              <span class="value" id="name">غير محدد</span>
            </div>
            <div class="info-item">
              <span class="label">الجنس</span>
              <span class="value" id="gender">غير محدد</span>
            </div>
            <div class="info-item">
              <span class="label">العمر</span>
              <span class="value" id="age">0 سنة</span>
            </div>
            <div class="info-item">
              <span class="label">الوزن</span>
              <span class="value" id="weight">0 كجم</span>
            </div>
            <div class="info-item">
              <span class="label">أمراض مزمنة</span>
              <span class="value" id="disease">لا يوجد</span>
            </div>
            <div class="info-item">
              <span class="label">الهدف</span>
              <span class="value" id="goal">غير محدد</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <a href="index.html" class="btn-back">تعديل البيانات</a>
        </div>
      </main>
    </div>

    <script>
      window.addEventListener('load', function () {
        const getValue = (key, fallback) => {
          const value = localStorage.getItem(key);
          return value !== null && value !== '' ? value : fallback;
        };

        const name = getValue('name', 'غير محدد');
        const gender = getValue('gender', 'غير محدد');
        const age = getValue('age', '0');
        const weight = getValue('weight', '0');
        const disease = getValue('disease', 'لا يوجد');
        const goal = getValue('goal', 'غير محدد');

        document.getElementById('name').textContent = name;
        document.getElementById('name-display').textContent = name;
        document.getElementById('gender').textContent = gender;
        document.getElementById('age').textContent = age + ' سنة';
        document.getElementById('weight').textContent = weight + ' كجم';
        document.getElementById('disease').textContent = disease;
        document.getElementById('goal').textContent = goal;

        document.getElementById('age-box').textContent = age;
        document.getElementById('weight-box').textContent = weight;
        document.getElementById('gender-box').textContent = gender;
      });
    </script>
  </body>
</html>
